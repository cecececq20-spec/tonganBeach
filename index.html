<!DOCTYPE html>
<html lang="ru"><head>
    <meta charset="utf-8">
    <title>Tongan Beach</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background: #87CEEB;">
    <canvas id="theCanvas" style="display:block;width:100vw;height:100vh;"></canvas>
<script>
const canvas = document.getElementById('theCanvas');
const ctx = canvas.getContext('2d');

const socket = io('https://tonganbeach.onrender.com');
let players = {};
let myId = null;

socket.emit('join', {team: 1});

socket.on('currentPlayers', (serverPlayers) => { 
  players = serverPlayers; 
});

socket.on('newPlayer', (player) => { 
  players[player.id] = player; 
});

let myRoomId = null;          // куда ты зашёл
let lobbyPlayers = [];        // массив для лобби

socket.on('lobbyUpdate', (data) => {
  myRoomId = data.roomId;
  lobbyPlayers = data.players;
  uiUpdateLobby();  // ниже сделаем эту функцию
});

socket.on('gameStart', (roomId) => {
  gameState = 'playing';
  gameStartTime = performance.now();
  // музыку, карту и т.п. можно запустить/обновить здесь
});
    
socket.on('playerMoved', (data) => { 
  if (players[data.id]) {
    players[data.id].x = data.x;
    players[data.id].y = data.y;
    players[data.id].dir = data.dir;
  }
});

function uiUpdateLobby() {
  if (gameState !== 'menu') return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(0, 50, 100, 0.8)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'white';
  ctx.textAlign = 'center';
  ctx.font = '24px Arial';

  // В uiUpdateLobby, в конце
  if (lobbyPlayers.length >= 2) {
    ctx.fillStyle = keys.Enter ? '#FFD700' : 'white';
    ctx.font = '32px Arial';
    ctx.fillText('Enter — старт', canvas.width / 2, y + 30);

    if (keys.Enter) {
      socket.emit('startGame', myRoomId);
      delete keys.Enter;
    }
  }

  let y = 100;
  ctx.fillText('ЛОББИ', canvas.width / 2, y);
  y += 40;

  lobbyPlayers.forEach(player => {
    const color = player.ready ? '#0f0' : '#888';
    ctx.fillStyle = color;
    ctx.fillText(
      `${player.name} (${player.team === 1 ? 'Синие' : 'Красные'})${player.ready ? ' ✅' : ''}`,
      canvas.width / 2,
      y
    );
    y += 30;
  });

  // кнопки / Enter для запуска — если хватает игроков
  if (lobbyPlayers.length >= 2) {
    ctx.fillStyle = keys.Enter ? '#FFD700' : 'white';
    ctx.font = '32px Arial';
    ctx.fillText('Enter — старт', canvas.width / 2, y + 30);
  }
}

const bgMusic = new Audio('ost/The parade.mp3');
bgMusic.loop = true;
bgMusic.volume = 0.3;

let gameState = 'menu';
let gameStartTime = 0;
const MATCHTIME = 300000; // 5 мин

function loadImage(src) {
    const img = new Image();
    img.src = src;
    return img;
}


const playerSprites = {
    right: [loadImage('playerpozez/Pl_right1.png'), loadImage('playerpozez/Pl_right2.png')],
    left: [loadImage('playerpozez/PL_left1.png'), loadImage('playerpozez/PL_left2.png')],
    up: [loadImage('playerpozez/Pl_up1.png'), loadImage('playerpozez/Pl_up2.png')],
    down: [loadImage('playerpozez/PL_down1.png'), loadImage('playerpozez/PL_down2.png')]
};

const sandTexture = loadImage('textures/sand_texture.png');
const rockTexture = loadImage('textures/rock.png');
const waterTexture = loadImage('textures/water_texture.png');

const itemTextures = {};
for (let i = 1; i <= 6; i++) {
    itemTextures[i] = loadImage(`items/item_${i}.png`);
}

const world = { width: 2000, height: 2000 };
const camera = { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    camera.width = canvas.width;
    camera.height = canvas.height;
}
window.addEventListener('resize', resize);
resize();

let team1Score = 0;
let team2Score = 0;

const player = { x: 100, y: 100, size: 40, speed: 5, dir: 'down', frame: 0, frameTimer: 0, frameInterval: 150, carryingItem: false, score: 0 };

const waterAreas = [
    { x: 1400, y: 300, width: 400, height: 250 },  // Большое озеро справа
    { x: 200, y: 1200, width: 300, height: 200 },  // Озеро снизу
    { x: 800, y: 1100, width: 250, height: 150 },  // Маленькое озеро
    { x: 1600, y: 1400, width: 350, height: 200 }  // Озеро в углу
];

const collisionMap = [
    { x: 100, y: 150, width: 50, height: 50 },
    { x: 300, y: 0, width: 50, height: 50 },
    { x: 0, y: 450, width: 50, height: 50 },
    { x: 500, y: 200, width: 50, height: 50 },
    { x: 700, y: 100, width: 50, height: 50 },
    { x: 200, y: 350, width: 30, height: 30 },
    { x: 400, y: 600, width: 50, height: 50 },
    { x: 900, y: 400, width: 55, height: 55 },
    { x: 600, y: 800, width: 40, height: 40 },
    { x: 1200, y: 200, width: 30, height: 30 }
];

const items = [
    { x: 150, y: 150, size: 30, collected: false, group: 1 },
    { x: 250, y: 80, size: 28, collected: false, group: 1 },
    { x: 50, y: 220, size: 32, collected: false, group: 1 },
    { x: 400, y: 120, size: 27, collected: false, group: 2 },
    { x: 600, y: 90, size: 31, collected: false, group: 2 },
    { x: 750, y: 180, size: 29, collected: false, group: 2 },
    { x: 100, y: 400, size: 33, collected: false, group: 3 },
    { x: 300, y: 380, size: 26, collected: false, group: 3 },
    { x: 550, y: 350, size: 30, collected: false, group: 4 },
    { x: 800, y: 300, size: 34, collected: false, group: 4 },
    { x: 950, y: 420, size: 28, collected: false, group: 4 },
    { x: 1100, y: 320, size: 31, collected: false, group: 5 },
    { x: 1250, y: 450, size: 29, collected: false, group: 5 },
    { x: 200, y: 650, size: 32, collected: false, group: 6 },
    { x: 400, y: 800, size: 30, collected: false, group: 6 },
    { x: 650, y: 700, size: 27, collected: false, group: 1 },
    { x: 850, y: 680, size: 33, collected: false, group: 2 },
    { x: 1050, y: 820, size: 29, collected: false, group: 4 },
    { x: 1200, y: 500, size: 31, collected: false, group: 4 },
    { x: 1300, y: 750, size: 28, collected: false, group: 6 }
];

const crabHole = { x: 400, y: 400, size: 100 };
const holeTexture = loadImage('textures/hole_texture.png');

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

function isColliding(rect1, rect2) {
    const r2w = rect2.width || rect2.size;
    const r2h = rect2.height || rect2.size;
    return rect1.x < rect2.x + r2w &&
           rect1.x + rect1.size > rect2.x &&
           rect1.y < rect2.y + r2h &&
           rect1.y + rect1.size > rect2.y;
}

function allLoaded() {
    return sandTexture.complete && rockTexture.complete && waterTexture.complete && 
           holeTexture.complete && 
           Object.values(playerSprites).every(arr => arr.every(img => img.complete)) &&
           Object.values(itemTextures).every(img => img.complete);
}

function resetGame() {
    player.score = 0;
    player.carryingItem = false;
    player.x = 100;
    player.y = 100;
    items.forEach(item => item.collected = false);
}

// СВОЙ PLAYER
const playerScreenX = player.x - camera.x;
const playerScreenY = player.y - camera.y;
const spriteArray = playerSprites[player.dir];
const img = spriteArray[player.frame];

if (img.complete) {
  // если хочешь, можно рисовать тень/цвет под ногами
  ctx.fillStyle = player.team === 1 ? 'rgba(0, 0, 255, 0.3)' : 'rgba(255, 0, 0, 0.3)';
  ctx.fillRect(playerScreenX, playerScreenY + player.size - 6, player.size, 6);
  ctx.drawImage(img, playerScreenX, playerScreenY, player.size, player.size);
} else {
  ctx.fillStyle = player.team === 1 ? '#00f' : '#f00';
  ctx.fillRect(playerScreenX, playerScreenY, player.size, player.size);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!allLoaded()) {
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = '24px Arial';
    ctx.fillText('Загрузка текстур...', canvas.width / 2, canvas.height / 2);
    requestAnimationFrame(loop);
    return;
  }

  // === МЕНЮ / ЛОББИ ===
  if (gameState === 'menu') {
    ctx.fillStyle = 'rgba(0, 50, 100, 0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = '48px Arial';
    ctx.fillText('TONGAN BEACH', canvas.width / 2, canvas.height / 2 - 100);
    ctx.font = '24px Arial';
    ctx.fillText('5v5 - 5 мин.', canvas.width / 2, canvas.height / 2 - 40);

    ctx.fillStyle = keys.Enter ? '#FFD700' : 'white';
    ctx.font = '32px Arial';
    ctx.fillText('ENTER', canvas.width / 2, canvas.height / 2 + 50);

    if (keys.Enter) {
      // 1) перейти из меню в игру
      gameState = 'playing';
      gameStartTime = performance.now();
      bgMusic.play().catch(console.log);

      // 2) в лобби сервера
      const defaultName = 'Игрок ' + Math.floor(Math.random() * 1000);
      const defaultRoom = 'public_room';

      socket.emit('lobbyJoin', {
        roomId: defaultRoom,
        playerName: defaultName
      });

      // снять Enter, чтобы не входить многократно
      delete keys.Enter;
    }

    requestAnimationFrame(loop);
    return;
  }

  // === GAME OVER (победа по командам) ===
  if (gameState === 'gameOver') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.font = '48px Arial';
    ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2);

    // соберём очки команд
    team1Score = Object.values(players)
      .filter(p => p.team === 1)
      .reduce((sum, p) => sum + p.score, 0);

    team2Score = Object.values(players)
      .filter(p => p.team === 2)
      .reduce((sum, p) => sum + p.score, 0);

    const winText = team1Score > team2Score ? 'ПОБЕДА СИНИХ!' :
                    team2Score > team1Score ? 'ПОБЕДА КРАСНЫХ!' :
                                               'НИЧЬЯ!';

    ctx.font = '28px Arial';
    ctx.fillStyle = team1Score > team2Score ? '#00f' :
                    team2Score > team1Score ? '#f00' : 'white';
    ctx.fillText(winText, canvas.width / 2, canvas.height / 2 + 60);
    ctx.fillText(`Счёт: ${team1Score} - ${team2Score}`, canvas.width / 2, canvas.height / 2 + 100);

    ctx.font = '32px Arial';
    ctx.fillText('ENTER', canvas.width / 2, canvas.height / 2 + 140);
    if (keys.Enter) {
      resetGame();
      gameState = 'menu';
    }

    requestAnimationFrame(loop);
    return;
  }

  // === ДВИЖЕНИЕ + ВОДА + ОБРАБОТКА ===
  const oldX = player.x;
  const oldY = player.y;
  let speedMultiplier = 1;

  waterAreas.forEach(area => {
    if (player.x < area.x + area.width &&
        player.x + player.size > area.x &&
        player.y < area.y + area.height &&
        player.y + player.size > area.y) {
      speedMultiplier = 0.6;
    }
  });

  const currentSpeed = player.speed * speedMultiplier;

  if (keys.ArrowLeft || keys.KeyA) player.x -= currentSpeed, player.dir = 'left';
  if (keys.ArrowRight || keys.KeyD) player.x += currentSpeed, player.dir = 'right';
  if (keys.ArrowUp || keys.KeyW) player.y -= currentSpeed, player.dir = 'up';
  if (keys.ArrowDown || keys.KeyS) player.y += currentSpeed, player.dir = 'down';

  const moving = keys.ArrowLeft || keys.KeyA || keys.ArrowRight || keys.KeyD ||
                 keys.ArrowUp || keys.KeyW || keys.ArrowDown || keys.KeyS;

  if (moving) {
    socket.emit('move', { x: player.x, y: player.y, dir: player.dir });
  }

  const now = performance.now();
  if (moving && now - player.frameTimer > player.frameInterval) {
    player.frame = (player.frame + 1) % 2;
    player.frameTimer = now;
  } else if (!moving) {
    player.frame = 0;
  }

  // Коллизии
  collisionMap.forEach(wall => {
    if (isColliding(player, wall)) {
      player.x = oldX;
      player.y = oldY;
    }
  });

  // Items логика
  if (!player.carryingItem) {
    for (let item of items) {
      if (!item.collected && isColliding(player, item)) {
        item.collected = true;
        player.carryingItem = true;
        break;
      }
    }
  }
  if (player.carryingItem && isColliding(player, crabHole)) {
    player.carryingItem = false;
    player.score++;
  }

  // Границы
  player.x = Math.max(0, Math.min(world.width - player.size, player.x));
  player.y = Math.max(0, Math.min(world.height - player.size, player.y));

  // Камера
  camera.x = Math.max(0, Math.min(world.width - camera.width, player.x + player.size / 2 - camera.width / 2));
  camera.y = Math.max(0, Math.min(world.height - camera.height, player.y + player.size / 2 - camera.height / 2));

  // ДРУГИЕ ИГРОКИ (с цветом команды)
  Object.values(players).forEach(otherPlayer => {
    if (otherPlayer.id !== myId) {
      const screenX = otherPlayer.x - camera.x;
      const screenY = otherPlayer.y - camera.y;
      ctx.fillStyle = otherPlayer.team === 1 ? '#00f' : '#f00';  // синие/красные
      ctx.fillRect(screenX, screenY, player.size, player.size);
    }
  });

  // ПЕСОК
  const TILESIZE = 64;
  for (let x = 0; x < canvas.width + TILESIZE; x += TILESIZE) {
    for (let y = 0; y < canvas.height + TILESIZE; y += TILESIZE) {
      ctx.drawImage(sandTexture, 0, 0, TILESIZE, TILESIZE, x, y, TILESIZE, TILESIZE);
    }
  }

  // ВОДА
  waterAreas.forEach(area => {
    const screenX = area.x - camera.x;
    const screenY = area.y - camera.y;
    if (screenX + area.width > 0 && screenX < canvas.width &&
        screenY + area.height > 0 && screenY < canvas.height) {
      if (waterTexture.complete) {
        const TILESIZE = 64;
        for (let tx = 0; tx < area.width; tx += TILESIZE) {
          for (let ty = 0; ty < area.height; ty += TILESIZE) {
            ctx.drawImage(waterTexture, 0, 0, TILESIZE, TILESIZE,
              screenX + tx, screenY + ty, TILESIZE, TILESIZE);
          }
        }
      } else {
        ctx.fillStyle = '#4169E1';
        ctx.fillRect(screenX, screenY, area.width, area.height);
      }
    }
  });

  // Скалы
  collisionMap.forEach(wall => {
    const screenX = wall.x - camera.x;
    const screenY = wall.y - camera.y;
    if (screenX + wall.width > 0 && screenX < canvas.width &&
        screenY + wall.height > 0 && screenY < canvas.height) {
      if (rockTexture.complete) {
        ctx.drawImage(rockTexture, screenX, screenY, wall.width, wall.height);
      } else {
        ctx.fillStyle = '#666';
        ctx.fillRect(screenX, screenY, wall.width, wall.height);
      }
    }
  });

  // Items
  items.forEach(item => {
    if (!item.collected) {
      const screenX = item.x - camera.x;
      const screenY = item.y - camera.y;
      if (screenX + item.size > 0 && screenX < canvas.width &&
          screenY + item.size > 0 && screenY < canvas.height) {
        const img = itemTextures[item.group];
        if (img.complete) {
          ctx.drawImage(img, screenX, screenY, item.size, item.size);
        } else {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(screenX + item.size / 2, screenY + item.size / 2, item.size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  });

  // Crab hole
  const holeScreenX = crabHole.x - camera.x;
  const holeScreenY = crabHole.y - camera.y;
  if (holeScreenX + crabHole.size > 0 && holeScreenX < canvas.width &&
      holeScreenY + crabHole.size > 0 && holeScreenY < canvas.height) {
    if (holeTexture.complete && holeTexture.naturalWidth > 0) {
      ctx.drawImage(holeTexture, holeScreenX, holeScreenY, crabHole.size, crabHole.size);
    } else {
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(holeScreenX, holeScreenY, crabHole.size, crabHole.size);
    }
  }

  // СВОЙ PLAYER (после других)
  const playerScreenX = player.x - camera.x;
  const playerScreenY = player.y - camera.y;
  const spriteArray = playerSprites[player.dir];
  const img = spriteArray[player.frame];

  if (img.complete) {
    // можно сделать тень под ногами
    ctx.fillStyle = player.team === 1 ? 'rgba(0, 0, 255, 0.3)' : 'rgba(255, 0, 0, 0.3)';
    ctx.fillRect(playerScreenX, playerScreenY + player.size - 6, player.size, 6);
    ctx.drawImage(img, playerScreenX, playerScreenY, player.size, player.size);
  } else {
    ctx.fillStyle = player.team === 1 ? '#00f' : '#f00';
    ctx.fillRect(playerScreenX, playerScreenY, player.size, player.size);
  }

  // UI: время и личный счёт
  const elapsed = Math.floor((performance.now() - gameStartTime) / 1000);
  const timeLeft = Math.max(0, 300 - elapsed);
  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;

  ctx.textAlign = 'left';
  ctx.fillStyle = 'white';
  ctx.font = '24px Arial';
  ctx.fillText(`Score: ${player.score}`, 20, 40);

  ctx.textAlign = 'right';
  ctx.fillText(`${minutes}:${seconds.toString().padStart(2, '0')}`, canvas.width - 20, 40);

  // проверка окончания матча
  if (performance.now() - gameStartTime > MATCHTIME) {
    gameState = 'gameOver';
  }

  requestAnimationFrame(loop);
}

loop();
</script>

</body>

</html>
